COM_MCPSERVER="MCP Server for Joomla"
COM_MCPSERVER_CONFIGURATION="MCP Server for Joomla: Options"
COM_MCPSERVER_CONFIG_TITLE="MCP Server for Joomla"
COM_MCPSERVER_CONFIG_DESC="Configure MCP Server endpoints, caching, and policies."
COM_MCPSERVER_CONFIG_FIELDSET_BASIC="Basic Settings"
COM_MCPSERVER_CONFIG_SERVER_NAME="Server Name"
COM_MCPSERVER_CONFIG_SERVER_NAME_DESC="The name of this MCP server as reported in capabilities and logs."
COM_MCPSERVER_CONFIG_BASE_URL="Target Base URL"
COM_MCPSERVER_CONFIG_BASE_URL_DESC="Target Joomla site base URL (for remote REST, leave empty for local)."
COM_MCPSERVER_CONFIG_API_TOKEN="Legacy Shared API Token"
COM_MCPSERVER_CONFIG_API_TOKEN_DESC="Joomla Web Services API token used for every outbound request only while Governed Mode is disabled. Governed Mode ignores this setting and uses the API token encrypted inside each individual MCP credential."
COM_MCPSERVER_CONFIG_API_TOKEN_DISABLED="Legacy Shared API Token disabled"
COM_MCPSERVER_CONFIG_API_TOKEN_DISABLED_DESC="Governed Mode is enabled, so this shared token is not used and cannot be edited here. MCP requests use the Joomla API token encrypted inside each individual governed credential. Disable Governed Mode first if you need to configure the legacy rollback token."
COM_MCPSERVER_CONFIG_VERIFY_SSL="Verify SSL Certificates"
COM_MCPSERVER_CONFIG_VERIFY_SSL_DESC="Verify SSL certificates. Disable for staging/dev with self-signed certs."
COM_MCPSERVER_CONFIG_RESOLVE_IP="Resolve Host To IP"
COM_MCPSERVER_CONFIG_RESOLVE_IP_DESC="Optional. Pin the Base URL hostname to this IP (e.g. 127.0.0.1) for the component's outbound REST calls only. Use when the server cannot reach its own public hostname (NAT hairpinning). The Host header and TLS validation still use the real hostname, so SSL verification can stay on. Leave empty to use normal DNS."
COM_MCPSERVER_CONFIG_CACHE_TTL="Cache TTL (seconds)"
COM_MCPSERVER_CONFIG_CACHE_TTL_DESC="Time to live for cached tool/resource lists."
COM_MCPSERVER_CONFIG_TOOLS_LIST_PAGE_SIZE="Tools List Page Size"
COM_MCPSERVER_CONFIG_TOOLS_LIST_PAGE_SIZE_DESC="Maximum number of tools returned per tools/list page."
COM_MCPSERVER_CONFIG_FIELDSET_SECURITY="Security Settings"
COM_MCPSERVER_CONFIG_REQUIRE_AUTH="Require Authentication"
COM_MCPSERVER_CONFIG_REQUIRE_AUTH_DESC="Whether to require authentication for MCP requests."
COM_MCPSERVER_CONFIG_MCP_BEARER_TOKEN_LABEL="MCP Bearer Token"
COM_MCPSERVER_CONFIG_MCP_BEARER_TOKEN_DESC="MCP Bearer token for authentication"
COM_MCPSERVER_CONFIG_IP_ALLOW_LIST="IP Allow List"
COM_MCPSERVER_CONFIG_IP_ALLOW_LIST_DESC="Comma-separated list of allowed IPs (leave empty to allow all)"
COM_MCPSERVER_CONFIG_ALLOWED_ORIGINS="Allowed CORS Origins"
COM_MCPSERVER_CONFIG_ALLOWED_ORIGINS_DESC="Comma-separated list of allowed CORS origins"
COM_MCPSERVER_CONFIG_TRUSTED_PROXIES="Trusted Proxies"
COM_MCPSERVER_CONFIG_TRUSTED_PROXIES_DESC="Comma-separated list of trusted proxy IPs. X-Forwarded-For header is only used when the request comes from one of these IPs."
COM_MCPSERVER_CONFIG_RATE_LIMIT_REQUESTS="Rate Limit Requests"
COM_MCPSERVER_CONFIG_RATE_LIMIT_REQUESTS_DESC="Max requests per window"
COM_MCPSERVER_CONFIG_RATE_LIMIT_WINDOW="Rate Limit Window (seconds)"
COM_MCPSERVER_CONFIG_RATE_LIMIT_WINDOW_DESC="Window in seconds"
COM_MCPSERVER_CONFIG_READ_ONLY="Read-Only Mode"
COM_MCPSERVER_CONFIG_READ_ONLY_DESC="When enabled, only read-only tools may run; every tool that writes, deletes or installs anything is blocked."
COM_MCPSERVER_CONFIG_DISABLED_TOOLS="Disabled Tools"
COM_MCPSERVER_CONFIG_DISABLED_TOOLS_DESC="Comma- or newline-separated MCP tool names to block. Enter 'none' to disable no tools (leaving the field empty falls back to the defaults)."
COM_MCPSERVER_CONFIG_GOVERNED_MODE="Governed Mode"
COM_MCPSERVER_CONFIG_GOVERNED_MODE_DESC="When enabled, MCP requests are authenticated with per-client stored credentials instead of the single shared bearer token above."
COM_MCPSERVER_CONFIG_RESOURCES_ENABLED="Enable Resources"
COM_MCPSERVER_CONFIG_RESOURCES_ENABLED_DESC="When enabled, MCP clients can list and read recent published articles as resources (joomla://article/{id})."
COM_MCPSERVER_CONFIG_PROMPTS_ENABLED="Enable Prompts"
COM_MCPSERVER_CONFIG_PROMPTS_ENABLED_DESC="When enabled, MCP clients can use guided prompts (draft article, SEO audit, translate article)."
COM_MCPSERVER_CONFIG_FIELDSET_MONITORING="Monitoring & Metrics"
COM_MCPSERVER_CONFIG_METRICS_ENABLED="Enable Request Metrics"
COM_MCPSERVER_CONFIG_METRICS_ENABLED_DESC="Record one row per MCP request for the dashboard. Disabling stops new recording but keeps existing data."
COM_MCPSERVER_CONFIG_METRICS_RETENTION_DAYS="Metrics Retention (days)"
COM_MCPSERVER_CONFIG_METRICS_RETENTION_DAYS_DESC="Request log rows older than this are automatically pruned. Default 360."

COM_MCPSERVER_COMPONENT_INTRO="Welcome to MCP Server for Joomla. Use the Options button to configure the component."
COM_MCPSERVER_COMPONENT_INTRO_GOVERNED="Governed Mode is active. Each person or client must use an individual governed credential; the legacy shared bearer and API tokens are ignored."

COM_MCPSERVER_BACKUP_WARNING_LABEL="Back up your site before connecting an LLM"
COM_MCPSERVER_BACKUP_WARNING_DESC="Any AI client connected to this server can create, change and delete real data on this site - articles, categories, menus, modules, users and extensions. LLMs make mistakes and can misread an instruction, and there is no undo for most of these operations. Take a full file and database backup before you connect a client, and test with Read-Only Mode enabled (Options, Security Settings) before you allow write access."

COM_MCPSERVER_MCPB_DOWNLOAD="Download Claude Desktop extension"
COM_MCPSERVER_MANUAL_GOVERNED_TITLE="Connect with an individual governed credential"
COM_MCPSERVER_MANUAL_GOVERNED_DESC="Governed Mode provides individual accountability. Do not use or share the legacy MCP bearer token."
COM_MCPSERVER_MANUAL_GOVERNED_STEP_1="Open the Manage Credentials page, request access for the intended client, then claim an approved request using the owner's Joomla Web Services API token."
COM_MCPSERVER_MANUAL_GOVERNED_STEP_2="Copy the generated mcp_ credential when it is displayed. It cannot be retrieved later."
COM_MCPSERVER_MANUAL_GOVERNED_STEP_3="Put that credential in the MCP client's AUTH_HEADER value shown in the configuration below."
COM_MCPSERVER_MANUAL_GOVERNED_STEP_4="Verify the connection, then review attributable activity in Dashboard > Recent Requests."
