COM_MCPSERVER_GOVERNANCE_STATUS_ACTIVE="Governed mode active"
COM_MCPSERVER_GOVERNANCE_STATUS_INACTIVE="Governed mode not active"
COM_MCPSERVER_GOVERNANCE_FINGERPRINT_LABEL="Credential encryption identity"
COM_MCPSERVER_GOVERNANCE_FINGERPRINT_DESC="Save this value with your backup records. After restoring or moving Joomla, compare it with the saved value. A match means this installation has the same Joomla secret and MCP credential salt needed to decrypt existing governed credentials. A mismatch means credentials must be reissued. This value cannot decrypt or recover credentials."
COM_MCPSERVER_GOVERNANCE_SETUP_READY="The credential salt is provisioned, so credentials can be issued and encrypted. Governed Mode itself is switched on separately in Options, once every client has its own credential."
