COM_MCPSERVER_GOVERNANCE_SETUP_TITLE="Governed Mode Setup"
COM_MCPSERVER_GOVERNANCE_SETUP_DESC="No credential salt is stored, so no credential can be issued or decrypted. The salt is normally generated automatically when the component is installed or updated — use this button if that did not happen. It generates one only while no credential exists: if credentials are already stored, their salt has been lost and must be restored from backup, because a new salt cannot decrypt them."
