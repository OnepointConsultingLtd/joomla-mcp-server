name: CI

on:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main

# Checkout is the only thing needing the token; nothing here writes back to the repo.
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.1"
          tools: composer

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Validate Composer manifest
        run: composer validate --working-dir=admin --no-check-publish

      - name: Install Composer dependencies
        run: composer install --working-dir=admin --no-interaction

      - name: Run unit tests
        run: admin/vendor/bin/phpunit --configuration phpunit.xml.dist

      - name: PHP syntax check
        run: |
          shopt -s globstar nullglob
          for file in **/*.php; do
            php -l "$file" > /dev/null
          done

      - name: JavaScript syntax check
        run: node --check site/mcp-http-bridge.js

      - name: Build release package
        run: ./build.sh

      - name: Verify package artifact
        run: test -f "com_mcpserver-$(grep -oP '<version>\K[^<]+' mcpserver.xml).zip"
